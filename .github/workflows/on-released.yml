name: Publish to PyPI

# Publishes quam-builder to PyPI when a GitHub Release is published.
# Uses PyPI trusted publishing (OIDC): no API token or secret is stored in this repo.
# The trusted publisher on PyPI must be configured with:
#   repository: qua-platform/quam-builder, workflow: on-released.yml, environment: pypi

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Check tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match pyproject.toml version '$VERSION'"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/quam-builder/
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
